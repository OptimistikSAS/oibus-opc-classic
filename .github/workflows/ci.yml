name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The helper targets net10.0-windows and talks to OPC servers over DCOM, which only exists on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The OPC Foundation's OpcNetApi/OpcNetApi.Com/OpcComRcw sources, pinned as a git submodule.
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Build the .NET helper
        run: dotnet build -c Release

      - name: Install npm dependencies
        run: npm ci

      - name: Build the TypeScript package
        run: npm run build

      - name: Run tests
        run: npm test
