name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          # Writes an .npmrc pointing at the public npm registry, authenticated via NODE_AUTH_TOKEN.
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm dependencies
        run: npm ci

      # One self-contained, single-file build per architecture, published straight into
      # runtimes/<rid>/ — exactly the layout resolveOpcBinaryPath() expects, and what
      # package.json's "files" ships. See package.json's build:win-* scripts for the actual
      # dotnet publish commands — running `npm run build:runtimes` locally does the same thing.
      - name: Build the .NET helper for every architecture
        run: npm run build:runtimes

      - name: Build the TypeScript package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
